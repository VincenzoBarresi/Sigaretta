<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigaretta? 🚬</title>

  <!-- Meta tag per l'anteprima (link preview) mostrata da WhatsApp/Telegram -->
  <meta property="og:title" content="Sigaretta? 🚬">
  <meta property="og:description" content="Tocca per rispondere 👀">
  <meta property="og:url" content="https://vincenzobarresi.github.io/Sigaretta/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Sigaretta? 🚬">
  <meta name="twitter:description" content="Tocca per rispondere 👀">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e0, #fff1c9);
    }

    .card {
      width: 90%;
      max-width: 450px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255,255,255,0.95);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    #question {
      font-size: 20px;
      color: #555;
      margin-bottom: 30px;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 15px 25px;
      margin: 8px;
      font-size: 17px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #yes {
      background: #ff6680;
      color: white;
      transition: transform 0.2s;
    }

    #yes:hover {
      transform: scale(1.08);
    }

    #no {
      background: #ddd;
      color: #333;
      position: relative;
      transition: left 0.12s, top 0.12s;
      touch-action: none;
    }

    #message {
      display: none;
      margin-top: 25px;
      font-size: 21px;
      font-weight: bold;
      color: #ff6680;
    }

    #counter {
      margin-top: 15px;
      font-size: 13px;
      color: #999;
    }

    #waLink {
      display: none;
      margin-top: 20px;
      padding: 14px 22px;
      border-radius: 30px;
      background: #25D366;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      margin-top: 25px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .video-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .playlist {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }

    .song {
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      background: #f1f1f1;
      color: #555;
      cursor: pointer;
    }

    .song.active {
      background: #ff6680;
      color: white;
    }

    .song-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 25px;
    }

    .song-form input {
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
    }

    .song-form button {
      background: #ff6680;
      color: white;
    }

    #songFormMsg {
      margin-top: 8px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Domanda importante 👀</h1>

    <div id="question">
      Sigaretta stasera? 🚬
    </div>

    <button id="yes">
      Sì, volentieri 😏
    </button>

    <button id="no">
      No 🙃
    </button>

    <div id="message">
      Sapevo che avresti detto sì 😂🚬
    </div>

    <a id="waLink" href="#">Apri WhatsApp e invia 📲</a>

    <div id="counter"></div>

    <form id="songForm" class="song-form">
      <input type="text" id="songNome" placeholder="Il tuo nome (opzionale)" maxlength="50">
      <input type="text" id="songCanzone" placeholder="Titolo o link della tua canzone preferita" maxlength="200" required>
      <button type="submit">Proponi una canzone 🎶</button>
    </form>

    <div id="songFormMsg"></div>

    <div class="video-wrap">
      <iframe
        id="player"
        src="https://www.youtube.com/embed/mh4AQkw4Jjc?autoplay=1"
        title="YouTube video player"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="playlist" id="playlist"></div>

  </div>

  <script>

    // Il tuo numero WhatsApp
    const mioNumero = "393483688570";

    // Le canzoni della playlist
    const canzoni = [
      { id: "mh4AQkw4Jjc", titolo: "🎵 Canzone 1" },
      { id: "Gd7uoXj9PFI", titolo: "🎵 Canzone 2" },
      { id: "bJtRONVWC08", titolo: "🎵 Canzone 3" }
    ];

    const player = document.getElementById("player");
    const playlist = document.getElementById("playlist");

    function suonaCanzone(index) {
      player.src =
        "https://www.youtube.com/embed/" +
        canzoni[index].id +
        "?autoplay=1";

      playlist.querySelectorAll(".song").forEach(function(btn, i) {
        btn.classList.toggle("active", i === index);
      });
    }

    canzoni.forEach(function(canzone, index) {
      const btn = document.createElement("button");
      btn.className = "song" + (index === 0 ? " active" : "");
      btn.textContent = canzone.titolo;
      btn.addEventListener("click", function() {
        suonaCanzone(index);
      });
      playlist.appendChild(btn);
    });

    // Invia la proposta di canzone via WhatsApp, come per il pulsante "Sì"
    const songForm = document.getElementById("songForm");
    const songFormMsg = document.getElementById("songFormMsg");

    songForm.addEventListener("submit", function(e) {
      e.preventDefault();

      const nome = document.getElementById("songNome").value.trim();
      const canzone = document.getElementById("songCanzone").value.trim();

      if (!canzone) {
        return;
      }

      const testo =
        "🎶 Queste sono le mie canzoni preferite" +
        (nome ? " (" + nome + ")" : "") +
        ": " + canzone;

      const link =
        "https://wa.me/" +
        mioNumero +
        "?text=" +
        encodeURIComponent(testo);

      songFormMsg.textContent = "Apro WhatsApp...";

      const a = document.createElement("a");
      a.href = link;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      songForm.reset();
    });

    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const message = document.getElementById("message");
    const question = document.getElementById("question");
    const counter = document.getElementById("counter");

    let tentativi = 0;

    function scappa() {

      tentativi++;

      const margine = 15;

      const maxX =
        window.innerWidth -
        no.offsetWidth -
        margine;

      const maxY =
        window.innerHeight -
        no.offsetHeight -
        margine;

      const x =
        margine +
        Math.random() *
        Math.max(1, maxX - margine);

      const y =
        margine +
        Math.random() *
        Math.max(1, maxY - margine);

      no.style.position = "fixed";
      no.style.left = x + "px";
      no.style.top = y + "px";

      if (tentativi === 3) {
        question.innerHTML =
          "Forse hai sbagliato 😂🚬";
      }

      if (tentativi === 5) {
        no.innerHTML = "Ancora no? 🥺";
      }

      if (tentativi === 7) {
        question.innerHTML =
          "Ok, ho capito... vuoi solo fare la difficile 😏";
      }

      if (tentativi === 10) {
        no.innerHTML = "NON CLICCARMI 😂";
      }

      counter.innerHTML =
        "Tentativi di dire no: " + tentativi;
    }

    // Computer
    no.addEventListener("mouseenter", scappa);

    // Smartphone/tablet: pointerdown copre touch e penna in un unico evento,
    // più affidabile di touchstart sui browser mobili
    no.addEventListener(
      "pointerdown",
      function(e) {
        e.preventDefault();
        scappa();
      },
      { passive: false }
    );

    // Se riesce comunque a cliccare
    no.addEventListener("click", function(e) {
      e.preventDefault();
      scappa();
    });

    // Pulsante SÌ
    yes.addEventListener("click", function() {

      message.style.display = "block";
      no.style.display = "none";

      question.innerHTML =
        "Perfetto 😏 Quando ci facciamo questa sigaretta? 🚬";

      counter.innerHTML = "";

      const testo = "Sì, ci sto 😏🚬";

      const link =
        "https://wa.me/" +
        mioNumero +
        "?text=" +
        encodeURIComponent(testo);

      // il link di riserva resta sempre visibile: nei browser "in-app"
      // (es. link aperto dentro WhatsApp/Instagram) il redirect automatico
      // può essere bloccato, quindi si può aprire WhatsApp toccandolo a mano
      const waLink = document.getElementById("waLink");
      waLink.href = link;
      waLink.style.display = "inline-block";

      // cliccare un <a> reale è più affidabile di window.location.href per far
      // riconoscere ai browser mobili l'apertura dell'app WhatsApp (deep link),
      // e va fatto SUBITO nello stesso gesto di click, senza setTimeout
      waLink.click();
    });

  </script>

</body>
</html>
